<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 90" width="520" height="90">
  <!-- Background -->
  <rect width="520" height="90" fill="#003F87"/>
  <!-- Ashoka Pillar (simplified) -->
  <g transform="translate(12,8)">
    <!-- Lions (circle) -->
    <circle cx="30" cy="18" r="12" fill="#FFD700"/>
    <text x="30" y="23" text-anchor="middle" font-family="serif" font-size="14" fill="#003F87" font-weight="bold">🦁</text>
    <!-- Pillar shaft -->
    <rect x="27" y="30" width="6" height="38" fill="#FFD700"/>
    <!-- Chakra -->
    <circle cx="30" cy="33" r="5" fill="none" stroke="#FFD700" stroke-width="1.5"/>
    <!-- Base -->
    <rect x="16" y="68" width="28" height="5" rx="2" fill="#FFD700"/>
    <rect x="12" y="73" width="36" height="4" rx="2" fill="#FFD700"/>
  </g>
  <!-- ESIC text -->
  <text x="65" y="42" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#FFD700" letter-spacing="4">ESIC</text>
  <!-- Full name -->
  <text x="65" y="62" font-family="Arial,sans-serif" font-size="13" fill="#FFFFFF">Employees&apos; State Insurance Corporation</text>
  <!-- Ministry -->
  <text x="65" y="80" font-family="Arial,sans-serif" font-size="10" fill="#CCDDFF">Ministry of Labour &amp; Employment, Govt. of India</text>
</svg>
